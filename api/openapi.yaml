openapi: 3.0.3
info:
  title: RPG API
  description: |
    The authoring API for the game's content: characters, conversations
    (nodes and the choices between them), and notes. This spec is the HTTP
    surface's source of truth: `make generate` turns it into
    internal/api/gen.

    Every operation needs a credential unless it says `security: []`: an
    `rpg_` api key or `rpg_at_` access token as `Authorization: Bearer ...`,
    or the web session cookie. A missing or unknown credential gets a 401
    whose WWW-Authenticate header points at OAuth discovery, which is how an
    MCP client such as claude.ai starts the connector flow.

    Every operation that changes something needs a human caller (a human
    api key, or a web session signed in with one) unless it says
    `x-agent-writable: true`. An agent caller gets a 403. Notes are the only
    thing an agent may write: the game's text is written by people. See
    docs/authorship.md.
  version: 0.1.0

servers:
  - url: /api

security:
  - bearerAuth: []
  - cookieAuth: []

paths:
  /me:
    get:
      operationId: getMe
      summary: The api key this request acts as
      responses:
        "200":
          description: The caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------------------
  # Characters
  # ---------------------------------------------------------------------------

  /characters:
    get:
      operationId: listCharacters
      summary: List characters by name
      responses:
        "200":
          description: The characters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createCharacter
      summary: Create a character
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterCreate"
      responses:
        "201":
          description: The created character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /characters/{characterId}:
    parameters:
      - $ref: "#/components/parameters/CharacterId"
    get:
      operationId: getCharacter
      summary: One character, with their bible
      responses:
        "200":
          description: The character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateCharacter
      summary: Change a character's name, bible, or both
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterUpdate"
      responses:
        "200":
          description: The updated character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      operationId: deleteCharacter
      summary: Delete a character
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Conversations, nodes and choices
  # ---------------------------------------------------------------------------

  /conversations:
    get:
      operationId: listConversations
      summary: List conversations, newest first
      responses:
        "200":
          description: The conversations, without their nodes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createConversation
      summary: Create an empty conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationCreate"
      responses:
        "201":
          description: The created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationGraph"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /conversations/{conversationId}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      operationId: getConversation
      summary: One conversation with every node and choice
      responses:
        "200":
          description: The conversation graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationGraph"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateConversation
      summary: Change a conversation's title, summary or start node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationUpdate"
      responses:
        "200":
          description: The updated conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationGraph"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      operationId: deleteConversation
      summary: Delete a conversation
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /conversations/{conversationId}/nodes:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    post:
      operationId: createNode
      summary: Add a line to a conversation
      description: The first node added becomes the start node if there is none.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeCreate"
      responses:
        "201":
          description: The created node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /nodes/{nodeId}:
    parameters:
      - $ref: "#/components/parameters/NodeId"
    patch:
      operationId: updateNode
      summary: Change a node's speaker, text, or both
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeUpdate"
      responses:
        "200":
          description: The updated node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      operationId: deleteNode
      summary: Delete a node and the choices it offers
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /nodes/{nodeId}/path:
    parameters:
      - $ref: "#/components/parameters/NodeId"
    get:
      operationId: getNodePath
      summary: The shortest route from the conversation's start to this node
      description: |
        The lines a player sees and the choices they make to get here. It is
        empty, with reachable false, when no route exists.
      responses:
        "200":
          description: The path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodePath"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /nodes/{nodeId}/choices:
    parameters:
      - $ref: "#/components/parameters/NodeId"
    post:
      operationId: createChoice
      summary: Add a choice the player can make at a node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChoiceCreate"
      responses:
        "201":
          description: The created choice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Choice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /choices/{choiceId}:
    parameters:
      - $ref: "#/components/parameters/ChoiceId"
    patch:
      operationId: updateChoice
      summary: Change a choice's text, target or order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChoiceUpdate"
      responses:
        "200":
          description: The updated choice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Choice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      operationId: deleteChoice
      summary: Delete a choice
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # World: flags, skills and quests
  # ---------------------------------------------------------------------------

  /flags:
    get:
      operationId: listFlags
      summary: List flags by key
      responses:
        "200":
          description: The flags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createFlag
      summary: Create a flag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlagCreate"
      responses:
        "201":
          description: The created flag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /flags/{flagId}:
    parameters:
      - $ref: "#/components/parameters/FlagId"
    patch:
      operationId: updateFlag
      summary: Change a flag's key, description or initial value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlagUpdate"
      responses:
        "200":
          description: The updated flag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      operationId: deleteFlag
      summary: Delete a flag
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /skills:
    get:
      operationId: listSkills
      summary: List skills by name
      responses:
        "200":
          description: The skills
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createSkill
      summary: Create a skill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillCreate"
      responses:
        "201":
          description: The created skill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /skills/{skillId}:
    parameters:
      - $ref: "#/components/parameters/SkillId"
    patch:
      operationId: updateSkill
      summary: Change a skill's key, name or starting level
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillUpdate"
      responses:
        "200":
          description: The updated skill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      operationId: deleteSkill
      summary: Delete a skill
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /quests:
    get:
      operationId: listQuests
      summary: List quests by name, with their stages
      responses:
        "200":
          description: The quests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createQuest
      summary: Create a quest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestCreate"
      responses:
        "201":
          description: The created quest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /quests/{questId}:
    parameters:
      - $ref: "#/components/parameters/QuestId"
    get:
      operationId: getQuest
      summary: One quest with its stages
      responses:
        "200":
          description: The quest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateQuest
      summary: Change a quest's key, name or summary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestUpdate"
      responses:
        "200":
          description: The updated quest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      operationId: deleteQuest
      summary: Delete a quest and its stages
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /quests/{questId}/stages:
    parameters:
      - $ref: "#/components/parameters/QuestId"
    post:
      operationId: createQuestStage
      summary: Add a stage to a quest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestStageCreate"
      responses:
        "201":
          description: The quest, with the new stage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /stages/{stageId}:
    parameters:
      - $ref: "#/components/parameters/StageId"
    patch:
      operationId: updateQuestStage
      summary: Change a quest stage's number, journal entry or whether it completes the quest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestStageUpdate"
      responses:
        "200":
          description: The quest, with the changed stage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      operationId: deleteQuestStage
      summary: Delete a quest stage
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Notes: feedback on the content, the one thing an agent may write
  # ---------------------------------------------------------------------------

  /notes:
    get:
      operationId: listNotes
      summary: List notes, oldest first
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/NoteStatus"
        - name: targetKind
          in: query
          schema:
            $ref: "#/components/schemas/NoteTargetKind"
        - name: targetId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: The notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
    post:
      operationId: createNote
      summary: Leave a note on the game, a character, a conversation, a node, a choice, a flag, a skill or a quest
      x-agent-writable: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteCreate"
      responses:
        "201":
          description: The created note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /notes/{noteId}:
    parameters:
      - $ref: "#/components/parameters/NoteId"
    get:
      operationId: getNote
      summary: One note
      responses:
        "200":
          description: The note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateNote
      summary: Resolve, dismiss or reopen a note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteUpdate"
      responses:
        "200":
          description: The updated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      operationId: deleteNote
      summary: Delete a note
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Build
  # ---------------------------------------------------------------------------

  /build:
    get:
      operationId: getBuildReport
      summary: Check the content as the build would, without writing a bundle
      description: |
        Errors stop a build: text that no human key wrote, a missing start
        node, a choice pointing at a deleted node, a script naming something
        deleted. Warnings do not: unreachable nodes, or a flag that is set
        but never read, for example.
      responses:
        "200":
          description: The report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildReport"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An rpg_ api key, or an rpg_at_ OAuth access token.
    cookieAuth:
      type: apiKey
      in: cookie
      name: rpg_session
      description: The web session set by /login.

  parameters:
    CharacterId:
      name: characterId
      in: path
      required: true
      schema:
        type: string
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
    NodeId:
      name: nodeId
      in: path
      required: true
      schema:
        type: string
    ChoiceId:
      name: choiceId
      in: path
      required: true
      schema:
        type: string
    FlagId:
      name: flagId
      in: path
      required: true
      schema:
        type: string
    SkillId:
      name: skillId
      in: path
      required: true
      schema:
        type: string
    QuestId:
      name: questId
      in: path
      required: true
      schema:
        type: string
    StageId:
      name: stageId
      in: path
      required: true
      schema:
        type: string
    NoteId:
      name: noteId
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No credential, or one that is unknown, expired or revoked
      content:
        text/plain:
          schema:
            type: string
    Forbidden:
      description: An agent caller tried to change the game's content
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unprocessable:
      description: The request parsed but a field is out of bounds
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Me:
      type: object
      required: [keyId, name, human]
      properties:
        keyId:
          type: string
        name:
          type: string
          description: The label the key was minted with.
        human:
          type: boolean
          description: |
            Whether this caller may write the game's text: a human key used
            directly or through a web session. An OAuth connector token is
            never human, whichever key approved it.

    # ---- characters ----

    Character:
      type: object
      required: [id, key, name, bible, companion, createdAt, updatedAt, url]
      properties:
        id:
          type: string
        key:
          type: string
          description: What scripts call the character (approval aria > 5). Authoring only.
        companion:
          type: boolean
          description: Can join the party; the journal shows a companion's approval.
        name:
          type: string
          description: Player-facing.
        bible:
          type: string
          description: Voice, wants, secrets, sample lines. Authoring only; never ships.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        url:
          type: string

    CharacterList:
      type: object
      required: [characters]
      properties:
        characters:
          type: array
          items:
            $ref: "#/components/schemas/Character"

    CharacterCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        key:
          type: string
          description: Leave out to make one from the name.
        bible:
          type: string
        companion:
          type: boolean

    CharacterUpdate:
      type: object
      description: Fields left out are left alone.
      properties:
        name:
          type: string
          x-go-type-skip-optional-pointer: false
        bible:
          type: string
          x-go-type-skip-optional-pointer: false
        key:
          type: string
          x-go-type-skip-optional-pointer: false
        companion:
          type: boolean
          x-go-type-skip-optional-pointer: false

    # ---- conversations ----

    Conversation:
      type: object
      required: [id, key, title, summary, startNodeId, label, condition, repeatable, opening, createdAt, updatedAt, url]
      properties:
        id:
          type: string
        key:
          type: string
          description: What scripts call the conversation (done docks). Authoring only.
        label:
          type: string
          description: Player-facing. What the player picks to start this conversation between others; empty when it is only reached from another.
        condition:
          type: string
          description: When the player may start it, in the script language; empty is always.
        repeatable:
          type: boolean
          description: Whether it stays available after it is finished once.
        opening:
          type: boolean
          description: Whether the game opens with it. One conversation does.
        title:
          type: string
          description: Authoring label; never ships.
        summary:
          type: string
          description: Authoring notes on what the conversation is for; never ships.
        startNodeId:
          type: string
          description: Empty until the conversation has a start node.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        url:
          type: string

    ConversationList:
      type: object
      required: [conversations]
      properties:
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"

    ConversationGraph:
      type: object
      required: [conversation, nodes]
      properties:
        conversation:
          $ref: "#/components/schemas/Conversation"
        nodes:
          type: array
          description: In the order they were written, each with its choices.
          items:
            $ref: "#/components/schemas/Node"

    ConversationCreate:
      type: object
      required: [title]
      properties:
        title:
          type: string
        key:
          type: string
          description: Leave out to make one from the title.
        summary:
          type: string

    ConversationUpdate:
      type: object
      description: Fields left out are left alone. An empty startNodeId clears it.
      properties:
        title:
          type: string
          x-go-type-skip-optional-pointer: false
        summary:
          type: string
          x-go-type-skip-optional-pointer: false
        startNodeId:
          type: string
          x-go-type-skip-optional-pointer: false
        key:
          type: string
          x-go-type-skip-optional-pointer: false
        label:
          type: string
          x-go-type-skip-optional-pointer: false
        condition:
          type: string
          x-go-type-skip-optional-pointer: false
        repeatable:
          type: boolean
          x-go-type-skip-optional-pointer: false
        opening:
          type: boolean
          x-go-type-skip-optional-pointer: false

    Node:
      type: object
      required: [id, conversationId, speakerId, speakerName, text, effects, choices, url]
      properties:
        id:
          type: string
        conversationId:
          type: string
        speakerId:
          type: string
          description: Empty for the narrator.
        speakerName:
          type: string
          description: Empty for the narrator.
        text:
          type: string
          description: Player-facing.
        effects:
          type: string
          description: What reaching this line changes, in the script language.
        choices:
          type: array
          items:
            $ref: "#/components/schemas/Choice"
        url:
          type: string

    NodeCreate:
      type: object
      required: [text]
      properties:
        speakerId:
          type: string
          description: A character id; leave out for the narrator.
        text:
          type: string
        effects:
          type: string

    NodeUpdate:
      type: object
      description: Fields left out are left alone. An empty speakerId makes the line the narrator's.
      properties:
        speakerId:
          type: string
          x-go-type-skip-optional-pointer: false
        text:
          type: string
          x-go-type-skip-optional-pointer: false
        effects:
          type: string
          x-go-type-skip-optional-pointer: false

    Choice:
      type: object
      required: [id, fromNodeId, toNodeId, text, sortOrder, condition, effects, checkSkillId, checkSkillName, checkDifficulty, failNodeId]
      properties:
        id:
          type: string
        fromNodeId:
          type: string
        toNodeId:
          type: string
          description: Empty when the choice ends the conversation.
        text:
          type: string
          description: Player-facing.
        sortOrder:
          type: integer
        condition:
          type: string
          description: When the choice shows, in the script language; empty is always.
        effects:
          type: string
          description: What taking the choice changes, in the script language.
        checkSkillId:
          type: string
          description: "When set, the choice is a skill check: 2d6 plus the player's skill against checkDifficulty. Success goes to toNodeId, failure to failNodeId."
        checkSkillName:
          type: string
        checkDifficulty:
          type: integer
        failNodeId:
          type: string

    ChoiceCreate:
      type: object
      required: [text]
      properties:
        text:
          type: string
        toNodeId:
          type: string
          description: A node in the same conversation; leave out to end the conversation.
        sortOrder:
          type: integer
        condition:
          type: string
        effects:
          type: string
        checkSkillId:
          type: string
        checkDifficulty:
          type: integer
        failNodeId:
          type: string

    ChoiceUpdate:
      type: object
      description: Fields left out are left alone. An empty toNodeId makes the choice end the conversation.
      properties:
        text:
          type: string
          x-go-type-skip-optional-pointer: false
        toNodeId:
          type: string
          x-go-type-skip-optional-pointer: false
        sortOrder:
          type: integer
          x-go-type-skip-optional-pointer: false
        condition:
          type: string
          x-go-type-skip-optional-pointer: false
        effects:
          type: string
          x-go-type-skip-optional-pointer: false
        checkSkillId:
          type: string
          description: An empty checkSkillId removes the check.
          x-go-type-skip-optional-pointer: false
        checkDifficulty:
          type: integer
          x-go-type-skip-optional-pointer: false
        failNodeId:
          type: string
          x-go-type-skip-optional-pointer: false

    NodePath:
      type: object
      required: [nodeId, conversationId, reachable, steps]
      properties:
        nodeId:
          type: string
        conversationId:
          type: string
        reachable:
          type: boolean
        steps:
          type: array
          description: From the start node to this one. Every step but the last has the choice taken there.
          items:
            $ref: "#/components/schemas/PathStep"

    PathStep:
      type: object
      required: [nodeId, speakerName, text, choiceId, choiceText]
      properties:
        nodeId:
          type: string
        speakerName:
          type: string
        text:
          type: string
        choiceId:
          type: string
        choiceText:
          type: string

    # ---- world ----

    Flag:
      type: object
      required: [id, key, description, initialValue, url]
      properties:
        id:
          type: string
        key:
          type: string
          description: What scripts call it. A flag is a number; 0 is false.
        description:
          type: string
          description: What it means. Authoring only.
        initialValue:
          type: integer
        url:
          type: string

    FlagList:
      type: object
      required: [flags]
      properties:
        flags:
          type: array
          items:
            $ref: "#/components/schemas/Flag"

    FlagCreate:
      type: object
      required: [key]
      properties:
        key:
          type: string
        description:
          type: string
        initialValue:
          type: integer

    FlagUpdate:
      type: object
      description: Fields left out are left alone.
      properties:
        key:
          type: string
          x-go-type-skip-optional-pointer: false
        description:
          type: string
          x-go-type-skip-optional-pointer: false
        initialValue:
          type: integer
          x-go-type-skip-optional-pointer: false

    Skill:
      type: object
      required: [id, key, name, initialLevel, url]
      properties:
        id:
          type: string
        key:
          type: string
        name:
          type: string
          description: Player-facing; shown on skill checks.
        initialLevel:
          type: integer
          description: The player's level at the start of the game.
        url:
          type: string

    SkillList:
      type: object
      required: [skills]
      properties:
        skills:
          type: array
          items:
            $ref: "#/components/schemas/Skill"

    SkillCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        key:
          type: string
          description: Leave out to make one from the name.
        initialLevel:
          type: integer

    SkillUpdate:
      type: object
      description: Fields left out are left alone.
      properties:
        name:
          type: string
          x-go-type-skip-optional-pointer: false
        key:
          type: string
          x-go-type-skip-optional-pointer: false
        initialLevel:
          type: integer
          x-go-type-skip-optional-pointer: false

    Quest:
      type: object
      required: [id, key, name, summary, stages, url]
      properties:
        id:
          type: string
        key:
          type: string
        name:
          type: string
          description: Player-facing; shown in the journal.
        summary:
          type: string
          description: Authoring only.
        stages:
          type: array
          items:
            $ref: "#/components/schemas/QuestStage"
        url:
          type: string

    QuestStage:
      type: object
      required: [id, questId, number, journal, completes]
      properties:
        id:
          type: string
        questId:
          type: string
        number:
          type: integer
          description: What scripts move the quest to (quest find_brother = 2). 0 is not started.
        journal:
          type: string
          description: Player-facing; the journal entry at this stage.
        completes:
          type: boolean

    QuestList:
      type: object
      required: [quests]
      properties:
        quests:
          type: array
          items:
            $ref: "#/components/schemas/Quest"

    QuestCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        key:
          type: string
          description: Leave out to make one from the name.
        summary:
          type: string

    QuestUpdate:
      type: object
      description: Fields left out are left alone.
      properties:
        name:
          type: string
          x-go-type-skip-optional-pointer: false
        key:
          type: string
          x-go-type-skip-optional-pointer: false
        summary:
          type: string
          x-go-type-skip-optional-pointer: false

    QuestStageCreate:
      type: object
      required: [number, journal]
      properties:
        number:
          type: integer
        journal:
          type: string
        completes:
          type: boolean

    QuestStageUpdate:
      type: object
      description: Fields left out are left alone.
      properties:
        number:
          type: integer
          x-go-type-skip-optional-pointer: false
        journal:
          type: string
          x-go-type-skip-optional-pointer: false
        completes:
          type: boolean
          x-go-type-skip-optional-pointer: false

    # ---- notes ----

    NoteTargetKind:
      type: string
      enum: [game, character, conversation, node, choice, flag, skill, quest]

    NoteKind:
      type: string
      enum: [gap, continuity, plot_idea, pacing, mechanics, question, other]

    NoteStatus:
      type: string
      enum: [open, resolved, dismissed]

    Note:
      type: object
      required: [id, targetKind, targetId, kind, body, status, parentId, authorName, byHuman, createdAt, updatedAt, url]
      properties:
        id:
          type: string
        targetKind:
          $ref: "#/components/schemas/NoteTargetKind"
        targetId:
          type: string
          description: Empty when targetKind is game.
        kind:
          $ref: "#/components/schemas/NoteKind"
        body:
          type: string
        status:
          $ref: "#/components/schemas/NoteStatus"
        parentId:
          type: string
          description: The note this replies to; empty for a new thread.
        authorName:
          type: string
        byHuman:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        url:
          type: string
          description: The page of what the note is about.

    NoteList:
      type: object
      required: [notes]
      properties:
        notes:
          type: array
          items:
            $ref: "#/components/schemas/Note"

    NoteCreate:
      type: object
      required: [body]
      properties:
        targetKind:
          $ref: "#/components/schemas/NoteTargetKind"
        targetId:
          type: string
        kind:
          $ref: "#/components/schemas/NoteKind"
        body:
          type: string
        parentId:
          type: string
          description: Reply to this note. A reply takes its parent's target, so leave targetKind and targetId out.

    NoteUpdate:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/NoteStatus"

    # ---- build ----

    BuildReport:
      type: object
      required: [ok, errors, warnings, stats]
      properties:
        ok:
          type: boolean
          description: True when there are no errors, so the content would build.
        errors:
          type: array
          items:
            $ref: "#/components/schemas/BuildIssue"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/BuildIssue"
        stats:
          $ref: "#/components/schemas/BuildStats"

    BuildIssue:
      type: object
      required: [code, message, targetKind, targetId, url]
      properties:
        code:
          type: string
        message:
          type: string
        targetKind:
          type: string
        targetId:
          type: string
        url:
          type: string

    BuildStats:
      type: object
      required: [characters, conversations, nodes, choices, flags, skills, quests, words, openNotes]
      properties:
        flags:
          type: integer
        skills:
          type: integer
        quests:
          type: integer
        characters:
          type: integer
        conversations:
          type: integer
        nodes:
          type: integer
        choices:
          type: integer
        words:
          type: integer
          description: Words of player-facing text.
        openNotes:
          type: integer
