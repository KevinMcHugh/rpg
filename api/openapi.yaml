openapi: 3.0.3
info:
  title: RPG API
  description: |
    The authoring API for the game's content: characters, conversations
    (nodes and the choices between them), and notes. This spec is the HTTP
    surface's source of truth: `make generate` turns it into
    internal/api/gen.

    Every operation needs a credential unless it says `security: []`: an
    `rpg_` api key or `rpg_at_` access token as `Authorization: Bearer ...`,
    or the web session cookie. A missing or unknown credential gets a 401
    whose WWW-Authenticate header points at OAuth discovery, which is how an
    MCP client such as claude.ai starts the connector flow.

    Content belongs to a game: lists and creates are under /games/{gameId},
    and each game has its own ruleset. Everything else is addressed by id,
    which is unique across games.

    A game belongs to its members: an owner, who may change or delete it and
    invite people, and writers. A caller sees only the games their user is a
    member of (an agent's key belongs to a user too); anything in another
    game is a 404, as if it did not exist. See docs/auth.md.

    Every operation that changes something needs a human caller (a human
    api key, or a web session signed in with one) unless it says
    `x-agent-writable: true`. An agent caller gets a 403. Notes are the only
    thing an agent may write: the game's text is written by people. See
    docs/authorship.md.
  version: 0.1.0

servers:
  - url: /api

security:
  - bearerAuth: []
  - cookieAuth: []

paths:
  /me:
    get:
      operationId: getMe
      summary: The api key this request acts as, and its user
      responses:
        "200":
          description: The caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------------------
  # Games: each holds its own content and has its own ruleset
  # ---------------------------------------------------------------------------

  /games:
    get:
      operationId: listGames
      summary: List the caller's games, oldest first
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: The games
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
    post:
      operationId: createGame
      summary: Create a game, owned by the caller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameCreate"
      responses:
        "201":
          description: The created game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /games/{gameId}:
    parameters:
      - $ref: "#/components/parameters/GameId"
    get:
      operationId: getGame
      summary: One game
      responses:
        "200":
          description: The game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateGame
      summary: Change a game's name, key or ruleset (its owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameUpdate"
      responses:
        "200":
          description: The updated game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      operationId: deleteGame
      summary: Delete a game; its content stops being listed or built (its owner only)
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /games/{gameId}/members:
    parameters:
      - $ref: "#/components/parameters/GameId"
    get:
      operationId: listMembers
      summary: The game's members, owner first
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: The members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /games/{gameId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/GameId"
      - $ref: "#/components/parameters/UserId"
    delete:
      operationId: removeMember
      summary: Take a writer out of the game (the owner may remove anyone else; a writer may leave)
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /games/{gameId}/invites:
    parameters:
      - $ref: "#/components/parameters/GameId"
    get:
      operationId: listInvites
      summary: The game's unused, unexpired invites (its owner only)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: The invites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
    post:
      operationId: createInvite
      summary: Make a single-use link that brings someone into the game as a writer (its owner only)
      description: |
        The response carries the link, which is shown this once: only a hash
        of it is stored. Whoever opens it signs in (or, with Google, signs
        up) and joins the game. An invite is not a credential: it grants
        nothing until someone signs in to redeem it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteCreate"
      responses:
        "201":
          description: The invite, with its link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /invites/{inviteId}:
    parameters:
      - $ref: "#/components/parameters/InviteId"
    delete:
      operationId: deleteInvite
      summary: Revoke an unused invite (its game's owner only)
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Characters
  # ---------------------------------------------------------------------------

  /games/{gameId}/characters:
    parameters:
      - $ref: "#/components/parameters/GameId"
    get:
      operationId: listCharacters
      summary: List characters by name
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: The characters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
    post:
      operationId: createCharacter
      summary: Create a character
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterCreate"
      responses:
        "201":
          description: The created character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /characters/{characterId}:
    parameters:
      - $ref: "#/components/parameters/CharacterId"
    get:
      operationId: getCharacter
      summary: One character, with their bible
      responses:
        "200":
          description: The character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateCharacter
      summary: Change a character's name, bible, or both
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterUpdate"
      responses:
        "200":
          description: The updated character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      operationId: deleteCharacter
      summary: Delete a character
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Conversations, nodes and choices
  # ---------------------------------------------------------------------------

  /games/{gameId}/conversations:
    parameters:
      - $ref: "#/components/parameters/GameId"
    get:
      operationId: listConversations
      summary: List conversations, newest first
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: The conversations, without their nodes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
    post:
      operationId: createConversation
      summary: Create an empty conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationCreate"
      responses:
        "201":
          description: The created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationGraph"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /conversations/{conversationId}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      operationId: getConversation
      summary: One conversation with every node and choice
      responses:
        "200":
          description: The conversation graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationGraph"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateConversation
      summary: Change a conversation's title, summary or start node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationUpdate"
      responses:
        "200":
          description: The updated conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationGraph"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      operationId: deleteConversation
      summary: Delete a conversation
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /conversations/{conversationId}/nodes:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    post:
      operationId: createNode
      summary: Add a line to a conversation
      description: The first node added becomes the start node if there is none.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeCreate"
      responses:
        "201":
          description: The created node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /nodes/{nodeId}:
    parameters:
      - $ref: "#/components/parameters/NodeId"
    patch:
      operationId: updateNode
      summary: Change a node's speaker, text, or both
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeUpdate"
      responses:
        "200":
          description: The updated node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      operationId: deleteNode
      summary: Delete a node and the choices it offers
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /nodes/{nodeId}/path:
    parameters:
      - $ref: "#/components/parameters/NodeId"
    get:
      operationId: getNodePath
      summary: The shortest route from the conversation's start to this node
      description: |
        The lines a player sees and the choices they make to get here. It is
        empty, with reachable false, when no route exists.
      responses:
        "200":
          description: The path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodePath"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /nodes/{nodeId}/choices:
    parameters:
      - $ref: "#/components/parameters/NodeId"
    post:
      operationId: createChoice
      summary: Add a choice the player can make at a node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChoiceCreate"
      responses:
        "201":
          description: The created choice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Choice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /choices/{choiceId}:
    parameters:
      - $ref: "#/components/parameters/ChoiceId"
    patch:
      operationId: updateChoice
      summary: Change a choice's text, target or order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChoiceUpdate"
      responses:
        "200":
          description: The updated choice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Choice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      operationId: deleteChoice
      summary: Delete a choice
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # World: flags, skills and quests
  # ---------------------------------------------------------------------------

  /games/{gameId}/flags:
    parameters:
      - $ref: "#/components/parameters/GameId"
    get:
      operationId: listFlags
      summary: List flags by key
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: The flags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
    post:
      operationId: createFlag
      summary: Create a flag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlagCreate"
      responses:
        "201":
          description: The created flag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /flags/{flagId}:
    parameters:
      - $ref: "#/components/parameters/FlagId"
    patch:
      operationId: updateFlag
      summary: Change a flag's key, description or initial value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlagUpdate"
      responses:
        "200":
          description: The updated flag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      operationId: deleteFlag
      summary: Delete a flag
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /games/{gameId}/skills:
    parameters:
      - $ref: "#/components/parameters/GameId"
    get:
      operationId: listSkills
      summary: List skills by name
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: The skills
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
    post:
      operationId: createSkill
      summary: Create a skill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillCreate"
      responses:
        "201":
          description: The created skill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /skills/{skillId}:
    parameters:
      - $ref: "#/components/parameters/SkillId"
    patch:
      operationId: updateSkill
      summary: Change a skill's key, name or starting level
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillUpdate"
      responses:
        "200":
          description: The updated skill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      operationId: deleteSkill
      summary: Delete a skill
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /games/{gameId}/quests:
    parameters:
      - $ref: "#/components/parameters/GameId"
    get:
      operationId: listQuests
      summary: List quests by name, with their stages
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: The quests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
    post:
      operationId: createQuest
      summary: Create a quest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestCreate"
      responses:
        "201":
          description: The created quest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /quests/{questId}:
    parameters:
      - $ref: "#/components/parameters/QuestId"
    get:
      operationId: getQuest
      summary: One quest with its stages
      responses:
        "200":
          description: The quest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateQuest
      summary: Change a quest's key, name or summary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestUpdate"
      responses:
        "200":
          description: The updated quest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      operationId: deleteQuest
      summary: Delete a quest and its stages
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /quests/{questId}/stages:
    parameters:
      - $ref: "#/components/parameters/QuestId"
    post:
      operationId: createQuestStage
      summary: Add a stage to a quest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestStageCreate"
      responses:
        "201":
          description: The quest, with the new stage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /stages/{stageId}:
    parameters:
      - $ref: "#/components/parameters/StageId"
    patch:
      operationId: updateQuestStage
      summary: Change a quest stage's number, journal entry or whether it completes the quest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestStageUpdate"
      responses:
        "200":
          description: The quest, with the changed stage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      operationId: deleteQuestStage
      summary: Delete a quest stage
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Notes: feedback on the content, the one thing an agent may write
  # ---------------------------------------------------------------------------

  /games/{gameId}/notes:
    parameters:
      - $ref: "#/components/parameters/GameId"
    get:
      operationId: listNotes
      summary: List notes, oldest first
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/NoteStatus"
        - name: targetKind
          in: query
          schema:
            $ref: "#/components/schemas/NoteTargetKind"
        - name: targetId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: The notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
    post:
      operationId: createNote
      summary: Leave a note on the game, a character, a conversation, a node, a choice, a flag, a skill or a quest
      x-agent-writable: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteCreate"
      responses:
        "201":
          description: The created note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /notes/{noteId}:
    parameters:
      - $ref: "#/components/parameters/NoteId"
    get:
      operationId: getNote
      summary: One note
      responses:
        "200":
          description: The note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateNote
      summary: Resolve, dismiss or reopen a note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteUpdate"
      responses:
        "200":
          description: The updated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      operationId: deleteNote
      summary: Delete a note
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Build
  # ---------------------------------------------------------------------------

  /games/{gameId}/build:
    parameters:
      - $ref: "#/components/parameters/GameId"
    get:
      operationId: getBuildReport
      summary: Check the content as the build would, without writing a bundle
      description: |
        Errors stop a build: text that no human key wrote, a missing start
        node, a choice pointing at a deleted node, a script naming something
        deleted. Warnings do not: unreachable nodes, or a flag that is set
        but never read, for example.
      responses:
        "200":
          description: The report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An rpg_ api key, or an rpg_at_ OAuth access token.
    cookieAuth:
      type: apiKey
      in: cookie
      name: rpg_session
      description: The web session set by /login.

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
    InviteId:
      name: inviteId
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: How many to return, from 1 to 200; leave out for 50.
      schema:
        type: integer
    After:
      name: after
      in: query
      description: Where to start, the next cursor from the previous page; leave out for the first page.
      schema:
        type: string
    GameId:
      name: gameId
      in: path
      required: true
      schema:
        type: string
    CharacterId:
      name: characterId
      in: path
      required: true
      schema:
        type: string
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
    NodeId:
      name: nodeId
      in: path
      required: true
      schema:
        type: string
    ChoiceId:
      name: choiceId
      in: path
      required: true
      schema:
        type: string
    FlagId:
      name: flagId
      in: path
      required: true
      schema:
        type: string
    SkillId:
      name: skillId
      in: path
      required: true
      schema:
        type: string
    QuestId:
      name: questId
      in: path
      required: true
      schema:
        type: string
    StageId:
      name: stageId
      in: path
      required: true
      schema:
        type: string
    NoteId:
      name: noteId
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No credential, or one that is unknown, expired or revoked
      content:
        text/plain:
          schema:
            type: string
    Forbidden:
      description: An agent caller tried to change the game's content, or a writer tried something only the game's owner may do
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Someone else changed it after the caller loaded it (the updatedAt sent is stale); reload, and make the change again
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unprocessable:
      description: The request parsed but a field is out of bounds
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Me:
      type: object
      required: [keyId, name, human]
      properties:
        user:
          x-go-type-skip-optional-pointer: false
          allOf:
            - $ref: "#/components/schemas/User"
        keyId:
          type: string
        name:
          type: string
          description: The label the key was minted with.
        human:
          type: boolean
          description: |
            Whether this caller may write the game's text: a human key used
            directly or through a web session. An OAuth connector token is
            never human, whichever key approved it.

    User:
      type: object
      description: The person a key belongs to. Missing for a key minted before there were users and never given one.
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string

    # ---- games ----

    Ruleset:
      type: string
      description: |
        How checks resolve. classic: 2d6 plus the skill against a difficulty.
        srd52: d20 plus ability modifier plus proficiency (SRD 5.2). srd35: d20
        plus skill ranks plus ability modifier (3.5 SRD). pf2e: d20 plus
        modifier with four degrees of success (Pathfinder 2e). See
        docs/mechanics.md.
      enum: [classic, srd52, srd35, pf2e]

    Role:
      type: string
      description: |
        owner: may change or delete the game and invite people, as well as
        write. writer: may write the game's content and leave notes.
      enum: [owner, writer]

    Game:
      type: object
      required: [id, key, name, ruleset, role, url, updatedAt]
      properties:
        updatedAt:
          type: string
          format: date-time
          description: When it last changed. Send it back as updatedAt when changing it.
        role:
          $ref: "#/components/schemas/Role"
        id:
          type: string
        key:
          type: string
        name:
          type: string
          description: Authoring label; never ships.
        ruleset:
          $ref: "#/components/schemas/Ruleset"
        url:
          type: string

    GameList:
      type: object
      required: [games, next]
      properties:
        next:
          type: string
          description: The cursor for the next page, to send as after; empty on the last page.
        games:
          type: array
          items:
            $ref: "#/components/schemas/Game"

    Member:
      type: object
      required: [userId, name, role, joinedAt]
      properties:
        userId:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        joinedAt:
          type: string
          format: date-time

    MemberList:
      type: object
      required: [members, next]
      properties:
        next:
          type: string
          description: The cursor for the next page, to send as after; empty on the last page.
        members:
          type: array
          items:
            $ref: "#/components/schemas/Member"

    Invite:
      type: object
      required: [id, gameId, note, expiresAt, createdAt]
      properties:
        id:
          type: string
        gameId:
          type: string
        note:
          type: string
          description: Who the invite is for, as a reminder; nobody else sees it.
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        url:
          type: string
          description: The link to send. Only in the response that created the invite.

    InviteList:
      type: object
      required: [invites, next]
      properties:
        next:
          type: string
          description: The cursor for the next page, to send as after; empty on the last page.
        invites:
          type: array
          items:
            $ref: "#/components/schemas/Invite"

    InviteCreate:
      type: object
      properties:
        note:
          type: string
        expiresInHours:
          type: integer
          description: How long the link works for. Defaults to 168 (a week); at most 720.

    GameCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        key:
          type: string
          description: A readable label for the command line; leave out to make one from the name. Not unique (the id is the game's identity).
        ruleset:
          $ref: "#/components/schemas/Ruleset"

    GameUpdate:
      type: object
      description: Fields left out are left alone.
      required: [updatedAt]
      properties:
        updatedAt:
          type: string
          format: date-time
          description: The game's updatedAt as the caller last loaded it. If it has changed since, someone else saved in between, and the change is refused with a 409; reload, and make the change again.
        name:
          type: string
          x-go-type-skip-optional-pointer: false
        key:
          type: string
          x-go-type-skip-optional-pointer: false
        ruleset:
          allOf:
            - $ref: "#/components/schemas/Ruleset"
          x-go-type-skip-optional-pointer: false

    # ---- characters ----

    Character:
      type: object
      required: [id, gameId, key, name, bible, companion, createdAt, updatedAt, url]
      properties:
        id:
          type: string
        gameId:
          type: string
        key:
          type: string
          description: What scripts call the character (approval aria > 5). Authoring only.
        companion:
          type: boolean
          description: Can join the party; the journal shows a companion's approval.
        name:
          type: string
          description: Player-facing.
        bible:
          type: string
          description: Voice, wants, secrets, sample lines. Authoring only; never ships.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        url:
          type: string

    CharacterList:
      type: object
      required: [characters, next]
      properties:
        next:
          type: string
          description: The cursor for the next page, to send as after; empty on the last page.
        characters:
          type: array
          items:
            $ref: "#/components/schemas/Character"

    CharacterCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        key:
          type: string
          description: Leave out to make one from the name.
        bible:
          type: string
        companion:
          type: boolean

    CharacterUpdate:
      type: object
      description: Fields left out are left alone.
      required: [updatedAt]
      properties:
        updatedAt:
          type: string
          format: date-time
          description: The character's updatedAt as the caller last loaded it. If it has changed since, someone else saved in between, and the change is refused with a 409; reload, and make the change again.
        name:
          type: string
          x-go-type-skip-optional-pointer: false
        bible:
          type: string
          x-go-type-skip-optional-pointer: false
        key:
          type: string
          x-go-type-skip-optional-pointer: false
        companion:
          type: boolean
          x-go-type-skip-optional-pointer: false

    # ---- conversations ----

    Conversation:
      type: object
      required: [id, gameId, key, title, summary, startNodeId, label, condition, repeatable, opening, createdAt, updatedAt, url]
      properties:
        id:
          type: string
        gameId:
          type: string
        key:
          type: string
          description: What scripts call the conversation (done docks). Authoring only.
        label:
          type: string
          description: Player-facing. What the player picks to start this conversation between others; empty when it is only reached from another.
        condition:
          type: string
          description: When the player may start it, in the script language; empty is always.
        repeatable:
          type: boolean
          description: Whether it stays available after it is finished once.
        opening:
          type: boolean
          description: Whether the game opens with it. One conversation does.
        title:
          type: string
          description: Authoring label; never ships.
        summary:
          type: string
          description: Authoring notes on what the conversation is for; never ships.
        startNodeId:
          type: string
          description: Empty until the conversation has a start node.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        url:
          type: string

    ConversationList:
      type: object
      required: [conversations, next]
      properties:
        next:
          type: string
          description: The cursor for the next page, to send as after; empty on the last page.
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"

    ConversationGraph:
      type: object
      required: [conversation, nodes]
      properties:
        conversation:
          $ref: "#/components/schemas/Conversation"
        nodes:
          type: array
          description: In the order they were written, each with its choices.
          items:
            $ref: "#/components/schemas/Node"

    ConversationCreate:
      type: object
      required: [title]
      properties:
        title:
          type: string
        key:
          type: string
          description: Leave out to make one from the title.
        summary:
          type: string

    ConversationUpdate:
      type: object
      description: Fields left out are left alone. An empty startNodeId clears it.
      required: [updatedAt]
      properties:
        updatedAt:
          type: string
          format: date-time
          description: The conversation's updatedAt as the caller last loaded it. If it has changed since, someone else saved in between, and the change is refused with a 409; reload, and make the change again.
        title:
          type: string
          x-go-type-skip-optional-pointer: false
        summary:
          type: string
          x-go-type-skip-optional-pointer: false
        startNodeId:
          type: string
          x-go-type-skip-optional-pointer: false
        key:
          type: string
          x-go-type-skip-optional-pointer: false
        label:
          type: string
          x-go-type-skip-optional-pointer: false
        condition:
          type: string
          x-go-type-skip-optional-pointer: false
        repeatable:
          type: boolean
          x-go-type-skip-optional-pointer: false
        opening:
          type: boolean
          x-go-type-skip-optional-pointer: false

    Node:
      type: object
      required: [id, conversationId, speakerId, speakerName, text, effects, choices, url, updatedAt]
      properties:
        updatedAt:
          type: string
          format: date-time
          description: When it last changed. Send it back as updatedAt when changing it.
        id:
          type: string
        conversationId:
          type: string
        speakerId:
          type: string
          description: Empty for the narrator.
        speakerName:
          type: string
          description: Empty for the narrator.
        text:
          type: string
          description: Player-facing.
        effects:
          type: string
          description: What reaching this line changes, in the script language.
        choices:
          type: array
          items:
            $ref: "#/components/schemas/Choice"
        url:
          type: string

    NodeCreate:
      type: object
      required: [text]
      properties:
        speakerId:
          type: string
          description: A character id; leave out for the narrator.
        text:
          type: string
        effects:
          type: string

    NodeUpdate:
      type: object
      description: Fields left out are left alone. An empty speakerId makes the line the narrator's.
      required: [updatedAt]
      properties:
        updatedAt:
          type: string
          format: date-time
          description: The node's updatedAt as the caller last loaded it. If it has changed since, someone else saved in between, and the change is refused with a 409; reload, and make the change again.
        speakerId:
          type: string
          x-go-type-skip-optional-pointer: false
        text:
          type: string
          x-go-type-skip-optional-pointer: false
        effects:
          type: string
          x-go-type-skip-optional-pointer: false

    Choice:
      type: object
      required: [id, fromNodeId, toNodeId, text, sortOrder, condition, effects, checkSkillId, checkSkillName, checkDifficulty, failNodeId, critSuccessNodeId, critFailNodeId, updatedAt]
      properties:
        updatedAt:
          type: string
          format: date-time
          description: When it last changed. Send it back as updatedAt when changing it.
        id:
          type: string
        fromNodeId:
          type: string
        toNodeId:
          type: string
          description: Empty when the choice ends the conversation.
        text:
          type: string
          description: Player-facing.
        sortOrder:
          type: integer
        condition:
          type: string
          description: When the choice shows, in the script language; empty is always.
        effects:
          type: string
          description: What taking the choice changes, in the script language.
        checkSkillId:
          type: string
          description: "When set, the choice is a skill check, rolled by the game's ruleset against checkDifficulty. Success goes to toNodeId, failure to failNodeId."
        checkSkillName:
          type: string
        checkDifficulty:
          type: integer
        failNodeId:
          type: string
        critSuccessNodeId:
          type: string
          description: Where a critical success goes, under a ruleset that has them (pf2e); empty is the ordinary success.
        critFailNodeId:
          type: string
          description: Where a critical failure goes; empty is the ordinary failure.

    ChoiceCreate:
      type: object
      required: [text]
      properties:
        text:
          type: string
        toNodeId:
          type: string
          description: A node in the same conversation; leave out to end the conversation.
        sortOrder:
          type: integer
        condition:
          type: string
        effects:
          type: string
        checkSkillId:
          type: string
        checkDifficulty:
          type: integer
        failNodeId:
          type: string
        critSuccessNodeId:
          type: string
        critFailNodeId:
          type: string

    ChoiceUpdate:
      type: object
      description: Fields left out are left alone. An empty toNodeId makes the choice end the conversation.
      required: [updatedAt]
      properties:
        updatedAt:
          type: string
          format: date-time
          description: The choice's updatedAt as the caller last loaded it. If it has changed since, someone else saved in between, and the change is refused with a 409; reload, and make the change again.
        text:
          type: string
          x-go-type-skip-optional-pointer: false
        toNodeId:
          type: string
          x-go-type-skip-optional-pointer: false
        sortOrder:
          type: integer
          x-go-type-skip-optional-pointer: false
        condition:
          type: string
          x-go-type-skip-optional-pointer: false
        effects:
          type: string
          x-go-type-skip-optional-pointer: false
        checkSkillId:
          type: string
          description: An empty checkSkillId removes the check.
          x-go-type-skip-optional-pointer: false
        checkDifficulty:
          type: integer
          x-go-type-skip-optional-pointer: false
        failNodeId:
          type: string
          x-go-type-skip-optional-pointer: false
        critSuccessNodeId:
          type: string
